<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 - Compras</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="container">
    <h1>3 - Lista de Compras (Frutas)</h1>
    <p class="descricao">Digite o nome de uma fruta para removê-la da lista ou digite <strong>PARE</strong> para encerrar.</p>

    <div id="listaFrutas" class="caixa-info"></div>

    <div class="grupo-input">
      <input type="text" id="nomeFruta" placeholder="Digite o nome da fruta ou PARE">
      <div class="botoes">
        <button id="btnRemover">Remover Fruta</button>
        <button id="btnPare" class="secundario">PARE</button>
      </div>
    </div>

    <div id="mensagem" class="mensagem">Escolha uma fruta da lista acima.</div>
  </div>

  <script src="/javascript/compras.js"></script>
</body>
</html>
