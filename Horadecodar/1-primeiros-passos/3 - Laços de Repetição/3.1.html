    <script>
       // 3.1. Crie uma bomba-relógio com contagem regressiva de 30 até 0 e, ao final, escreva `EXPLOSÃO`.

       
var inicio = 30;
var fim = 0;

while (inicio > fim) {
    document.writeln("<p>Explodindo em: " + inicio + "<p>" );
    inicio--  
}

    document.writeln("BOOOM")
    document.writeln("Fim do programa")
       
    </script>
</body>
