<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //3.2. Leia dois valores. Enquanto o segundo valor for menor ou igual a zero, peça novamente esse mesmo valor. Ao final, 
        // mostre a divisão do primeiro pelo segundo.

        let num1 = parseFloat(prompt("Insira o primeiro número: "));
        let num2 = parseFloat(prompt("Insira o segundo número: "));

        while (num2 <= 0) {
           num2 = prompt("Escreva o segundo número de novo.");
        }

        let divisao = num1/num2;
        
        alert("Divisão = " + divisao);


        
        
    </script>
</body>
</html>
