<body>
    <script>
        //3.4. Leia dois inteiros (sendo o primeiro menor que o segundo) e calcule a média desses números e de todos os
        //  inteiros entre eles.


  let primeiro = Number(prompt("Digite o primeiro inteiro:"));
let segundo = Number(prompt("Digite o segundo inteiro:"));

let soma = 0;
let quantidade = 0;

for (let i = primeiro; i <= segundo; i++) {
    soma += i;
    quantidade++;
}

let media = soma / quantidade;

console.log("A média é: " + media);



        
    </script>
</body>
