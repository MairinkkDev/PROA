    <SCRIpt>
        //3.5. Leia 2 notas de um aluno, calcule a média final e considere aprovação com nota 9,5. 
        // Em seguida, pergunte: `Calcular a média de outro aluno? (S/N)`. Se a resposta for `S`, repita; caso contrário, encerre e mostre a quantidade de alunos aprovados.


        let resposta = "S";
        let aprovados = 0;

while (resposta == "S") {
    let nota1 = Number(prompt("Digite a primeira nota:"));
    let nota2 = Number(prompt("Digite a segunda nota:"));

    let media = (nota1 + nota2) / 2;

    console.log("Média final: " + media);

    if (media >= 9.5) {
        console.log("Aluno aprovado!");
        aprovados++;
    } else {
        console.log("Aluno reprovado!");
    }

    resposta = prompt("Calcular a média de outro aluno? (S/N)").toUpperCase();
}

console.log("Quantidade de alunos aprovados: " + aprovados);

    </SCRIpt>
