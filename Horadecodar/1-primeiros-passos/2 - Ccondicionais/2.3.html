<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //2.3. Leia 3 valores diferentes e mostre o maior.

        var numero1 = prompt("Insira um número: ")
        var numero2 = prompt("Insira outro número: ")
        var numero3 = prompt("Insira mais um número: ");

        if(numero1 > numero2 && numero3){
            alert("Número maior é: " + numero1)
        }

        else  if(numero2 > numero3 && numero1){
            alert("Número maior é: " + numero2)
        }

        else  if(numero3 > numero2 && numero1){
            alert("Número maior é: " + numero3)
        }

        else if(numero3 == numero2 && numero1){
            alert("Os números são iguais")
        }

    </script>
</body>
</html>
