<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        let numero1 = prompt("Escreva o primeiro número: ")
        let numero2 = prompt("Escreva o segundo número: ")
        let numero3 = prompt("Escreva o terceiro número: ")
        let numero4 = prompt("Escreva o quarto número: ")
  

        let n1 = Number(numero1)
        let n2 = Number(numero2)
        let n3 = Number(numero3)
        let n4 = Number(numero4)
    
        let maior = Math.max(n1,n2,n3,n4)
        let menor = Math.min(n1,n2,n3,n4)

        alert("Número maior: " + maior + "\n Número menor: " + menor + "\n Primeiro número : " + n1 + "\n último número: " + n4)
    </script>
    
</body>
</html>
