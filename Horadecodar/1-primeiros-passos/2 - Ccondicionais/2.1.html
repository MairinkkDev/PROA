<body>
   <script>
//2.1. Leia dois números e mostre o maior deles.

var numero1 = prompt("Escreva um número: ")
var numero2 = prompt("Escreva outro número: ")


if(numero1 < numero2){
    alert("Maior número: " + numero2)
}

else if(numero1 > numero2){
    alert("Maior número: " + numero1)
}


   </script> 
</body>
